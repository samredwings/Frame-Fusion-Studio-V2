name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "android-release-v*"
    tags:
      - "android-v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 16 SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Type-check project
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Enable Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build offline web bundle
        run: npm run android:sync

      - name: Resolve Android release version
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/heads/android-release-v')
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="android-${GITHUB_REF_NAME#android-release-}"
          fi
          version="${tag#android-v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a semantic version such as android-v1.0.1; got: $tag" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code > 2100000000 )); then
            echo "Version code exceeds Android's supported limit: $version_code" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.release_meta.outputs.version || '1.0' }}
          ANDROID_VERSION_CODE: ${{ steps.release_meta.outputs.version_code || '1' }}
        run: cd android && ./gradlew assembleDebug -PVERSION_NAME="$ANDROID_VERSION_NAME" -PVERSION_CODE="$ANDROID_VERSION_CODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frame-fusion-studio-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish debug APK release
        if: steps.release_meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          name: Frame Fusion Studio ${{ steps.release_meta.outputs.tag }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Installable Android debug APK built from the offline app bundle.

            This is a debug build for testing. A signed release build is required for Google Play distribution.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
