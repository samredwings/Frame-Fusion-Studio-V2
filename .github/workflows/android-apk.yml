name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "android-release-*"
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android 16 SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install packages
        run: npm ci

      - name: Enable Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build offline Android APK
        run: npm run android:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frame-fusion-studio-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish debug APK release
        if: startsWith(github.ref, 'refs/tags/android-v') || github.ref == 'refs/heads/android-release-v1.0.1'
        uses: softprops/action-gh-release@v2
        with:
          name: Frame Fusion Studio android-v1.0.1
          tag_name: android-v1.0.1
          target_commitish: android-release-v1.0.1
          body: |
            Installable Android debug APK built from the offline app bundle.

            This is a debug build for testing. A signed release build is required for Google Play distribution.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
